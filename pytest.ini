[pytest]
testpaths = backend/tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers --import-mode=importlib -m 'not (real_time or restore)'
pythonpath = .
markers =
    integration: requires an explicitly configured PostgreSQL 18 test database
    real_time: selected long acceptance with real publication cadence (at least900seconds)
    restore: selected isolated PostgreSQL and acquisition-volume backup/restore verification
