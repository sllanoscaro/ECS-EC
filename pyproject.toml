# Shared backend tooling. Regenerate uv.lock with uv lock after deliberate upgrades.
[project]
name = "ecs-ec"
version = "0.1.0"
description = "Fundaciones del monolito de monitoreo eléctrico ECS-EC"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "jsonschema==4.26.0",
    "loguru==0.7.3",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.2",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.0.55",
    "tzdata==2026.6",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/ecs_ec"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
]
