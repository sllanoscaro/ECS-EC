;007: finite Viewer through authenticated gateway; no alternative human login/cookie.
[server]
root_url = https://localhost:3443/grafana/
serve_from_sub_path = true
router_logging = false
[auth]
disable_login_form = true
disable_signout_menu = true
; Grafana13 needs its local user resolver for AuthProxy provisioning. Form/Basic
; and gateway login routes remain disabled; this does not expose local human login.
disable_login = false
[auth.basic]
enabled = false
[auth.anonymous]
enabled = false
[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = username
auto_sign_up = true
sync_ttl = 0
headers = Role:X-WEBAUTH-ROLE
enable_login_token = false
; Compose assigns gateway a fixed private address; never accept proxy from app or tools.
whitelist = 172.30.7.2
[users]
allow_sign_up = false
allow_org_create = false
auto_assign_org = true
auto_assign_org_role = Viewer
viewers_can_edit = false
[security]
disable_initial_admin_creation = true
disable_gravatar = true
cookie_secure = true
cookie_samesite = strict
data_source_proxy_whitelist = loki:3100 jaeger:16686
[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false
[plugins]
plugin_admin_enabled = false
preinstall_disabled = true
[dataproxy]
timeout = 25
[log]
mode = console
level = error
; Disable tool diagnostics that can include URLs, subjects, query text or IP.
[log.console]
level = critical
