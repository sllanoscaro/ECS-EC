#007: per-request Basic and process-specific mTLS; unknown routes deny by default.
load_module /usr/lib/nginx/modules/ngx_http_js_module.so;
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;
env OBS_ENVIRONMENT;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    js_import gateway from /etc/nginx/gateway.js;
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    upstream grafana_source { zone grafana_source 64k; server grafana:3000 resolve; }
    upstream loki_source { zone loki_source 64k; server loki:3100 resolve; }
    upstream jaeger_source { zone jaeger_source 64k; server jaeger:16686 resolve; }
    upstream otlp_source { zone otlp_source 64k; server jaeger:4318 resolve; }
    upstream alloy_source { zone alloy_source 64k; server alloy:12345 resolve; }
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 30s;
    keepalive_timeout 15s;
    proxy_connect_timeout 2s;
    proxy_read_timeout 30s;
    proxy_send_timeout 5s;
    proxy_buffering on;
    proxy_cache off;
    subrequest_output_buffer_size 16m;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $http_content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-WEBAUTH-USER "";
    proxy_set_header X-WEBAUTH-ROLE "";
    proxy_set_header X-Scope-OrgID "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Host "";
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    add_header Cache-Control no-store always;
    map $uri $obs_query_subject {
        default "";
        ~^/logs/loki/api/v1/(query|query_range)$ $remote_user;
        /grafana/api/ds/query $remote_user;
        ~^/jaeger/api/ $remote_user;
    }
    limit_conn_zone $obs_query_subject zone=technical_queries:1m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /tls/server.crt;
    ssl_certificate_key /tls/server.key;
    ssl_session_cache off;
    ssl_session_tickets off;

    server {
        listen 8443 ssl default_server;
        server_name localhost;
        # Listener fixes environment. Unknown Host never reaches a source.
        if ($host != localhost) { return 403; }
        auth_basic "ECS technical environment";
        auth_basic_user_file /credentials/authorized;
        limit_conn technical_queries 4;
        limit_conn_status 429;
        location / { js_content gateway.read; }
        location /_grafana/ {
            internal;
            auth_basic off;
            proxy_pass http://grafana_source/grafana/;
            proxy_set_header Content-Type $http_content_type;
            proxy_set_header Host localhost;
            proxy_set_header X-WEBAUTH-USER $remote_user;
            proxy_set_header X-WEBAUTH-ROLE Viewer;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header X-Forwarded-Proto https;
        }
        location /_loki/ { internal; auth_basic off; proxy_pass http://loki_source/; }
        location /_jaeger/ { internal; auth_basic off; proxy_pass http://jaeger_source/; }
    }
    # Each process listener authorizes certificate identity in addition to CA.
    server {
        listen 8444 ssl;
        listen 8445 ssl;
        listen 8446 ssl;
        server_name technical-gateway;
        ssl_client_certificate /tls/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 1;
        client_max_body_size 8m;
        client_body_buffer_size 8m;
        proxy_read_timeout 5s;
        location / { js_content gateway.ingest; }
        location /_otlp/ { internal; proxy_pass http://otlp_source/; }
        location /_loki/ { internal; proxy_pass http://loki_source/; }
        location /_alloy/ { internal; proxy_pass http://alloy_source/; }
    }
}
