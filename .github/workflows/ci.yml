# Locked installation, PostgreSQL 18 integration and the single production image.
name: Platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
        env:
          POSTGRES_USER: ecs_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ecs_test
          PGDATA: /var/lib/postgresql/18/docker
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ecs_ci -d ecs_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecs_ci:synthetic-ci-only@localhost:5432/ecs_test
      NEXT_TELEMETRY_DISABLED: "1"
      DB_PORT: "55448"
      APP_PORT: "58006"
      PUBLIC_URL: http://127.0.0.1:58006
      E2E_BASE_URL: http://127.0.0.1:58006
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest --cov=ecs_ec --cov-report=term-missing
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run typecheck
      - name: Prepare isolated identity browser fixtures
        run: |
          python - <<'PY'
          """Provision ephemeral CI-only secrets privately, with no password in logs or arguments."""
          import os, secrets
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ecs-ec-identity'
          root.mkdir(mode=0o700)
          password = root / 'initial'
          password.write_text(secrets.token_urlsafe(24))
          password.chmod(0o600)
          values = {
              'IDENTITY_ENABLED': 'true', 'IDENTITY_DEVELOPMENT_HTTP': 'true',
              'IDENTITY_CSRF_KEY': secrets.token_urlsafe(32),
              'IDENTITY_LOGIN_BUCKET_KEY': secrets.token_urlsafe(32),
              'IDENTITY_E2E_PASSWORD_FILE': str(password), 'ENVIRONMENT': 'test',
              'POSTGRES_DB': 'ecs_identity_ui_test',
          }
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              for key, value in values.items():
                  stream.write(f'{key}={value}\n')
          PY
      - run: docker compose build app
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
      - run: docker compose up -d --wait app
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
      - name: Seed the separate browser database
        run: uv run --locked python scripts/seed_identity_reference.py --password-file "$IDENTITY_E2E_PASSWORD_FILE"
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ecs_local:synthetic-ci-only@localhost:55448/ecs_identity_ui_test
          DATABASE_URL: postgresql+psycopg://ecs_local:synthetic-ci-only@localhost:55448/ecs_ci_source
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - if: always()
        run: docker compose down
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
