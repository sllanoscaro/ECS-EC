# Locked installation, PostgreSQL 18 integration and the single production image.
name: Platform
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.3-bookworm@sha256:80630f83606d8db77d30b3851b16a9f78be2d0d4dda6f7b82a1fdca5ebe3acba
        env:
          POSTGRES_USER: ecs_ci
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: ecs_test
          PGDATA: /var/lib/postgresql/18/docker
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ecs_ci -d ecs_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ecs_ci:synthetic-ci-only@localhost:5432/ecs_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest --cov=ecs_ec --cov-report=term-missing
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend run typecheck
      - run: docker compose build app
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
      - run: docker compose up -d --wait app
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
      - run: npx --prefix frontend playwright install --with-deps chromium
      - run: npm --prefix frontend run test:e2e
      - if: always()
        run: docker compose down
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
